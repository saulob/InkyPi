<div style="margin-bottom:14px;">
    <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size:1em; color:var(--text-primary); font-weight:500; background:var(--bg-secondary); padding:12px 14px; border-left:3px solid var(--border-color); border-radius:2px; line-height:1.4; max-width:100%;">
        Display a clean calendar with a large date focus, visually inspired by the iPhone Duo calendar interface. Designed for quick readability and optimized for e-paper displays
    </div>
</div>

<div class="form-group">
    <span style="color: var(--text-primary);">If the date field is blank it will default to today's date.</span>
</div>

<div class="form-group">
    <label for="customDate" class="form-label">Date (optional)</label>
    <input type="date" id="customDate" name="customDate" class="form-input">
</div>

<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        {% for code, name in language_options %}
            <option value="{{ code }}"{% if code == 'en' %} selected{% endif %}>{{ name }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="primaryColor" class="form-label">Primary Color:</label>
        <input type="color" id="primaryColor" name="primaryColor" class="color-picker" value="{{ primary_color }}">
    </div>
    <div class="form-group">
        <label for="highlightColor" class="form-label">Highlight Color:</label>
        <input type="color" id="highlightColor" name="highlightColor" class="color-picker" value="{{ highlight_color }}">
    </div>
</div>

<div class="form-group">
    <label for="showHighlightDay" class="form-label">Show Highlight Day:</label>
    <div class="toggle-container">
        <input type="hidden" id="showHighlightDayValue" name="showHighlightDay" value="true">
        <input type="checkbox" id="showHighlightDay" class="toggle-checkbox" checked>
        <label for="showHighlightDay" class="toggle-label"></label>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const showHighlightDayCheckbox = document.getElementById('showHighlightDay');
        const showHighlightDayValue = document.getElementById('showHighlightDayValue');

        if (showHighlightDayCheckbox && showHighlightDayValue) {
            showHighlightDayCheckbox.addEventListener('change', () => {
                showHighlightDayValue.value = showHighlightDayCheckbox.checked ? 'true' : 'false';
            });
        }

        if (typeof loadPluginSettings !== 'undefined' && loadPluginSettings && pluginSettings) {
            document.getElementById('customDate').value = pluginSettings.customDate || '';
            const language = document.getElementById('language');
            language.value = pluginSettings.language || pluginSettings.locale || 'en';
            if (!language.querySelector(`option[value="${language.value}"]`)) {
                language.value = 'en';
            }

            document.getElementById('primaryColor').value = pluginSettings.primaryColor || '{{ primary_color }}';
            document.getElementById('highlightColor').value = pluginSettings.highlightColor || '{{ highlight_color }}';

            const showHighlightDayValueFromSettings = pluginSettings.showHighlightDay;
            const showHighlightDayChecked = showHighlightDayValueFromSettings
                ? showHighlightDayValueFromSettings === 'true'
                : true;
            if (showHighlightDayCheckbox && showHighlightDayValue) {
                showHighlightDayCheckbox.checked = showHighlightDayChecked;
                showHighlightDayValue.value = showHighlightDayChecked ? 'true' : 'false';
            }
        }
    });
</script>
