<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input"></select>
    <br>
    <div id="localeSupportInfo" style="display: block; flex-basis: 100%; width: 100%; margin-top: 6px; font-size: 0.9em; line-height: 1.35;"></div>
    <div id="localeMissingInfo" style="display: block; flex-basis: 100%; width: 100%; margin-top: 4px; font-size: 0.85em; color: #b00; font-style: italic;">
        Unfortunately, not all languages are supported by the plugin font or your browser. Only supported languages are shown. If your language is missing, please use English.
    </div>
</div>

<input type="hidden" id="monthNames" name="monthNames">
<input type="hidden" id="weekdayNames" name="weekdayNames">
<script id="calendarCardFontUnsupportedLocales" type="application/json">{{ font_unsupported_locales_json | safe }}</script>

<script>
    const unsupportedLabel = 'not supported';
    const fontUnsupportedLocales = new Set(JSON.parse(
        document.getElementById('calendarCardFontUnsupportedLocales')?.textContent || '[]'
    ));
    const localeMap = JSON.parse('{{ locale_map | tojson | safe }}');
    const fallbackMonths = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];
    const fallbackWeekdays = [
        'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'
    ];

    function capitalizeFirstLetter(value, locale = 'en') {
        const text = String(value || '').trim();
        if (!text) {
            return text;
        }

        const chars = Array.from(text);
        chars[0] = chars[0].toLocaleUpperCase(locale);
        return chars.join('');
    }

    function resolveSupportedLocale(languageCode) {
        if (typeof Intl === 'undefined' || typeof Intl.DateTimeFormat !== 'function') {
            return null;
        }

        const code = (languageCode || '').trim();
        if (!code) {
            return null;
        }

        const candidates = [code];
        if (code.includes('-')) {
            candidates.push(code.split('-')[0]);
        }

        const supported = Intl.DateTimeFormat.supportedLocalesOf(candidates, {
            localeMatcher: 'lookup'
        });
        return supported.length ? supported[0] : null;
    }

    function populateSupportedLocales(languageSelect) {
        if (!languageSelect) return;
        languageSelect.innerHTML = '';
        for (const [code, name] of Object.entries(localeMap)) {
            const browserSupported = Boolean(resolveSupportedLocale(code));
            const fontSupported = !fontUnsupportedLocales.has(code);
            if (browserSupported && fontSupported) {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = name;
                languageSelect.appendChild(opt);
            }
        }
    }

    function updateLocaleSupportInfo(languageSelect) {
        const info = document.getElementById('localeSupportInfo');
        if (!languageSelect || !info) {
            return;
        }

        const selectedOption = languageSelect.options[languageSelect.selectedIndex];
        if (!selectedOption) {
            info.textContent = '';
            return;
        }

        const browserSupported = selectedOption.dataset.browserSupported !== 'false';
        const fontSupported = selectedOption.dataset.fontSupported !== 'false';
        const browserUnsupportedCount = Number(languageSelect.dataset.browserUnsupportedCount || 0);
        const fontUnsupportedCount = Number(languageSelect.dataset.fontUnsupportedCount || 0);

        if (!browserSupported) {
            info.textContent = 'This language is not supported by this browser and will show not supported.';
            return;
        }

        if (!fontSupported) {
            info.textContent = 'This language is not supported by the plugin font and will show not supported.';
            return;
        }

        if (browserUnsupportedCount > 0 || fontUnsupportedCount > 0) {
            info.textContent = 'Some languages are unavailable and are marked as not supported in the list.';
            return;
        }

        info.textContent = '';
    }

    function buildUnsupportedNames() {
        return {
            months: Array(12).fill(unsupportedLabel),
            weekdays: Array(7).fill(unsupportedLabel)
        };
    }

    function buildLocalizedNames(languageCode) {
        if (typeof Intl === 'undefined' || typeof Intl.DateTimeFormat !== 'function') {
            return buildUnsupportedNames();
        }

        const locale = resolveSupportedLocale(languageCode);
        if (!locale) {
            return buildUnsupportedNames();
        }

        try {
            const monthFormatter = new Intl.DateTimeFormat(locale, {
                month: 'long',
                timeZone: 'UTC'
            });
            const weekdayFormatter = new Intl.DateTimeFormat(locale, {
                weekday: 'long',
                timeZone: 'UTC'
            });

            const months = [];
            for (let monthIndex = 0; monthIndex < 12; monthIndex += 1) {
                months.push(capitalizeFirstLetter(
                    monthFormatter.format(new Date(Date.UTC(2026, monthIndex, 1))),
                    locale
                ));
            }

            const weekdays = [];
            for (let dayOffset = 0; dayOffset < 7; dayOffset += 1) {
                weekdays.push(capitalizeFirstLetter(
                    weekdayFormatter.format(new Date(Date.UTC(2026, 0, 5 + dayOffset))),
                    locale
                ));
            }

            return { months, weekdays };
        } catch (error) {
            return buildUnsupportedNames();
        }
    }

    function syncCalendarCardLocaleFields() {
        const languageSelect = document.getElementById('language');
        const monthNamesInput = document.getElementById('monthNames');
        const weekdayNamesInput = document.getElementById('weekdayNames');

        if (!languageSelect || !monthNamesInput || !weekdayNamesInput) {
            return;
        }

        let localizedNames = buildLocalizedNames(languageSelect.value);
        const hasBlank = arr => !Array.isArray(arr) || arr.some(v => !v || String(v).trim() === '');
        if (hasBlank(localizedNames.months) || hasBlank(localizedNames.weekdays)) {
            localizedNames = buildUnsupportedNames();
        }
        monthNamesInput.value = JSON.stringify(localizedNames.months);
        weekdayNamesInput.value = JSON.stringify(localizedNames.weekdays);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const languageSelect = document.getElementById('language');
        if (!languageSelect) return;
        populateSupportedLocales(languageSelect);
        let selectedLanguage = 'en';
        if (typeof loadPluginSettings !== 'undefined' && loadPluginSettings &&
            typeof pluginSettings !== 'undefined' && pluginSettings && pluginSettings.language) {
            selectedLanguage = pluginSettings.language;
        }
        if (!languageSelect.querySelector(`[value="${selectedLanguage}"]`)) {
            selectedLanguage = 'en';
        }
        languageSelect.value = selectedLanguage;
        syncCalendarCardLocaleFields();
        updateLocaleSupportInfo(languageSelect);
        languageSelect.addEventListener('change', () => {
            syncCalendarCardLocaleFields();
            updateLocaleSupportInfo(languageSelect);
        });
    });
</script>
