<div style="margin-bottom:14px;">
	<div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size:1em; color:var(--text-primary); font-weight:500; background:var(--bg-secondary); padding:12px 14px; border-left:3px solid var(--border-color); border-radius:2px; line-height:1.4; max-width:100%;">
		Displays a random popular movie of the day using TMDB. Selects from high-engagement movies with posters, rating and year
	</div>
</div>

<div class="form-group">
	<label for="language" class="form-label">Language:</label>
	<select id="language" name="language" class="form-input">
		<option value="nl">Dutch</option>
		<option value="en">English</option>
		<option value="fr">French</option>
		<option value="de">German</option>
		<option value="id">Indonesian</option>
		<option value="it">Italian</option>
		<option value="pt-BR">Portuguese (pt-BR)</option>
		<option value="pt-PT">Portuguese (pt-PT)</option>
		<option value="es">Spanish</option>
	</select>
</div>

<script>
	document.addEventListener('DOMContentLoaded', () => {
		const language = document.getElementById('language');
		if (typeof pluginSettings === 'object' && pluginSettings !== null) {
			const savedLanguage = pluginSettings.language === 'pt' ? 'pt-BR' : pluginSettings.language;
			language.value = savedLanguage || 'en';
			if (!language.querySelector(`option[value="${savedLanguage}"]`)) {
				language.value = 'en';
			}
		} else {
			language.value = 'en';
		}
	});
</script>
