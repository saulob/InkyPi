<div style="margin-bottom:14px;">
    <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size:1em; color:var(--text-primary); font-weight:500; background:var(--bg-secondary); padding:12px 14px; border-left:3px solid var(--border-color); border-radius:2px; line-height:1.4; max-width:100%;">
        Emoji Mood displays a mood emoji with a short caption on each refresh. You can choose a fixed mood or use random or smart selection based on time and day
    </div>
</div>

<div class="form-group">
    <label for="mode" class="form-label">Mode:</label>
    <select id="mode" name="mode" class="form-input">
        <option value="random">Random</option>
        <option value="adventure">Adventure</option>
        <option value="focus">Focus</option>
        <option value="fun">Fun</option>
        <option value="happy">Happy</option>
        <option value="love">Love</option>
        <option value="low_energy">Low Energy</option>
        <option value="neutral">Neutral</option>
        <option value="sick">Sick</option>
        <option value="stress">Stress</option>
        <option value="weird">Weird</option>
    </select>
</div>

<div class="form-group">
    <label for="behavior" class="form-label">Behavior:</label>
    <select id="behavior" name="behavior" class="form-input">
        <option value="random">Random</option>
        <option value="smart">Smart (time and day based)</option>
    </select>
</div>

<div class="form-group">
    <label for="captionStyle" class="form-label">Caption Style:</label>
    <select id="captionStyle" name="captionStyle" class="form-input">
        <option value="normal">Normal</option>
        <option value="minimal">Minimal</option>
    </select>
</div>

<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        <option value="nl">Dutch</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="id">Indonesian</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="pt-br">Portuguese (Brazil)</option>
        <option value="es">Spanish</option>
    </select>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="primaryColor" class="form-label">Primary Color (Text):</label>
        <input type="color" name="primaryColor" class="color-picker" value="#000000"/>
    </div>
    <div class="form-group">
        <label for="secondaryColor" class="form-label">Secondary Color (Background):</label>
        <input type="color" name="secondaryColor" class="color-picker" value="#ffffff"/>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof loadPluginSettings !== 'undefined' && loadPluginSettings && pluginSettings) {
            // Populate mode selection
            const selectedMode = pluginSettings.mode || pluginSettings.Mode || 'random';
            document.getElementById('mode').value = selectedMode;
            
            // Populate behavior selection
            const selectedBehavior = pluginSettings.behavior || 'random';
            document.getElementById('behavior').value = selectedBehavior;
            
            // Populate caption style selection
            const selectedCaptionStyle = pluginSettings.captionStyle || 'normal';
            const captionEl = document.getElementById('captionStyle');
            if (captionEl) {
                captionEl.value = selectedCaptionStyle;
            }
            
            // Populate language selection
            const selectedLanguage = pluginSettings.language || 'en';
            const langEl = document.getElementById('language');
            if (langEl) {
                langEl.value = selectedLanguage;
            }
            
            // Populate primary and secondary colors
            const primaryInput = document.querySelector('[name=primaryColor]');
            const secondaryInput = document.querySelector('[name=secondaryColor]');
            
            if (primaryInput) {
                primaryInput.value = pluginSettings.primaryColor || '#000000';
            }
            if (secondaryInput) {
                secondaryInput.value = pluginSettings.secondaryColor || '#ffffff';
            }
        }
    });
</script>
