<div style="margin-bottom:14px;">
    <div style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size:1em; color:var(--text-primary); font-weight:500; background:var(--bg-secondary); padding:12px 14px; border-left:3px solid var(--border-color); border-radius:2px; line-height:1.4; max-width:100%;">
        Displays the current time, date, and day progress. Uses the timezone and time format configured in Settings.
    </div>
</div>

<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        <option value="nl">Dutch</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="id">Indonesian</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="es">Spanish</option>
    </select>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="primaryColor" class="form-label">Primary Color:</label>
        <input id="primaryColor" type="color" name="primaryColor" class="color-picker" value="#ffffff"/>
    </div>
    <div class="form-group">
        <label for="secondaryColor" class="form-label">Secondary Color:</label>
        <input id="secondaryColor" type="color" name="secondaryColor" class="color-picker" value="#000000"/>
    </div>
    <div class="form-group">
        <label for="progressBarColor" class="form-label">Progress Bar Color:</label>
        <input id="progressBarColor" type="color" name="progressBarColor" class="color-picker" value="#cc3232"/>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const language = document.getElementById('language');
        if (typeof pluginSettings === 'object' && pluginSettings !== null) {
            language.value = pluginSettings.language || 'en';
            // Fallback to English if saved language is no longer available
            if (!language.querySelector(`option[value="${pluginSettings.language}"]`)) {
                language.value = 'en';
            }
            if (pluginSettings.primaryColor) {
                document.querySelector("[name=primaryColor]").value = pluginSettings.primaryColor;
            }
            if (pluginSettings.secondaryColor) {
                document.querySelector("[name=secondaryColor]").value = pluginSettings.secondaryColor;
            }
            if (pluginSettings.progressBarColor) {
                document.querySelector("[name=progressBarColor]").value = pluginSettings.progressBarColor;
            }
        } else {
            language.value = 'en';
        }
    });
</script>
