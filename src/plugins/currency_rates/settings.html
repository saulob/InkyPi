<div class="form-group" id="titleOptionWrapper">
    <label class="form-label">Title:</label>

    <div class="form-group">
        <input type="radio" id="title-custom" name="titleSelection" value="custom" checked>
        <label for="title-custom">Custom</label>
        <input type="text" id="customTitle" name="customTitle" class="form-input" placeholder="Type something...">
    </div>
</div>

<div class="form-group">
    <label class="form-label">Pair 1</label>
    <div class="form-group">
        <label for="from_currency_1" class="form-label">From</label>
        <select id="from_currency_1" name="from_currency_1" class="form-input">
            {% for code, name in currencies.items() %}
            <option value="{{ code }}">{{ code }} - {{ name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="to_currency_1" class="form-label">To</label>
        <select id="to_currency_1" name="to_currency_1" class="form-input">
            {% for code, name in currencies.items() %}
            <option value="{{ code }}">{{ code }} - {{ name }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group">
    <label class="form-label">Pair 2</label>
    <div class="form-group">
        <label for="from_currency_2" class="form-label">From</label>
        <select id="from_currency_2" name="from_currency_2" class="form-input">
            {% for code, name in currencies.items() %}
            <option value="{{ code }}">{{ code }} - {{ name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="to_currency_2" class="form-label">To</label>
        <select id="to_currency_2" name="to_currency_2" class="form-input">
            {% for code, name in currencies.items() %}
            <option value="{{ code }}">{{ code }} - {{ name }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group">
    <span style="color: #8a8f98; font-size: 0.95em;">Exchange rates provided by Frankfurter API</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('customTitle').value = pluginSettings.customTitle || pluginSettings.title || '';
            document.getElementById('from_currency_1').value = pluginSettings.from_currency_1 || 'EUR';
            document.getElementById('to_currency_1').value = pluginSettings.to_currency_1 || 'USD';
            document.getElementById('from_currency_2').value = pluginSettings.from_currency_2 || 'USD';
            document.getElementById('to_currency_2').value = pluginSettings.to_currency_2 || 'EUR';
            document.getElementById('title-custom').checked = true;
        } else {
            document.getElementById('customTitle').value = '';
            document.getElementById('from_currency_1').value = 'EUR';
            document.getElementById('to_currency_1').value = 'USD';
            document.getElementById('from_currency_2').value = 'USD';
            document.getElementById('to_currency_2').value = 'EUR';
        }
    });
</script>
