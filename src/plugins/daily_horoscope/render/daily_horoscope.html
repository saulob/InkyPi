{% extends "plugin.html" %}

{% block content %}

<div class="horoscope-container">
    <!-- Fixed header zone: stays anchored at top -->
    <div class="horoscope-header">
        <h1 class="horoscope-title">{{ title }}</h1>
        <p class="horoscope-date">{{ date_display }}</p>
    </div>

    <!-- Flexible content zone: vertically balanced via JS -->
    <div class="horoscope-content">
        <div class="horoscope-content-inner" id="contentInner">
            <div class="horoscope-sign">
                <span class="zodiac-symbol">{{ symbol }}</span>
                <span class="sign-name">{{ sign_display }}</span>
            </div>

            <div class="horoscope-body">
                <p class="horoscope-text" id="horoscopeText">{{ horoscope_text }}</p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    try {
        const header = document.querySelector('.horoscope-header');
        const contentZone = document.querySelector('.horoscope-content');
        const inner = document.getElementById('contentInner');
        const p = document.getElementById('horoscopeText');
        if (!header || !contentZone || !inner || !p) return;

        const vh = window.innerHeight;

        // Minimum gap between header (date) and content (symbol)
        var minGap = Math.round(vh * 0.025);
        // Minimum bottom margin to keep content from touching edge
        var minBottom = Math.round(vh * 0.02);

        // Available vertical space for the content zone
        var headerBottom = header.getBoundingClientRect().bottom;
        var availableHeight = vh - headerBottom - minBottom;
        if (availableHeight <= 0) return;

        // Set content zone to fill the available space
        contentZone.style.height = availableHeight + 'px';

        // Ensure paragraph wraps at the body width for accurate measurement
        var body = document.querySelector('.horoscope-body') || inner;
        var bodyWidth = Math.max(0, body.clientWidth);
        if (bodyWidth > 0) p.style.width = bodyWidth + 'px';

        // Keep original text for truncation
        var original = (p.textContent || '').trim();
        p.textContent = original;

        // Measure natural height of the content block
        var contentHeight = inner.scrollHeight;

        // Truncate if content truly exceeds available space (minus minGap at top)
        var usable = availableHeight - minGap;
        if (contentHeight > usable && original) {
            var words = original.split(/\s+/);
            var low = 0, high = words.length;
            while (low < high) {
                var mid = Math.ceil((low + high) / 2);
                p.textContent = words.slice(0, mid).join(' ') + (mid < words.length ? '...' : '');
                if (inner.scrollHeight <= usable) {
                    low = mid;
                } else {
                    high = mid - 1;
                }
            }
            p.textContent = words.slice(0, low).join(' ') + (low < words.length ? '...' : '');
            contentHeight = inner.scrollHeight;
        }

        // Adaptive centering:
        // ratio = how much of the usable space the content fills (0..1)
        // When ratio is low (short text) -> center perfectly
        // When ratio approaches 1 (long text) -> shift toward top smoothly
        // The centering factor eases from 0.5 (centered) to ~0.15 (near top but not glued)
        var freeSpace = Math.max(0, usable - contentHeight);
        var ratio = usable > 0 ? Math.min(1, contentHeight / usable) : 1;

        // Smooth easing: use a quadratic curve to transition from 0.5 to 0.15
        // centerFactor = 0.5 when ratio=0, 0.15 when ratio=1
        var centerFactor = 0.5 - 0.35 * (ratio * ratio);
        var topOffset = minGap + Math.round(freeSpace * centerFactor);

        contentZone.style.paddingTop = topOffset + 'px';

    } catch (e) {
        console.warn('Horoscope layout script error', e);
    }
});
</script>
{% endblock %}
