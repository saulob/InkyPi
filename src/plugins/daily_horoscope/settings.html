<div class="form-group">
    <div class="form-group">
        <label for="sign" class="form-label">Zodiac Sign</label>
        <select id="sign" name="sign" class="form-input" required>
            <option value="aries">Aries</option>
            <option value="taurus">Taurus</option>
            <option value="gemini">Gemini</option>
            <option value="cancer">Cancer</option>
            <option value="leo">Leo</option>
            <option value="virgo">Virgo</option>
            <option value="libra">Libra</option>
            <option value="scorpio">Scorpio</option>
            <option value="sagittarius">Sagittarius</option>
            <option value="capricorn">Capricorn</option>
            <option value="aquarius">Aquarius</option>
            <option value="pisces">Pisces</option>
        </select>
    </div>
    <div class="form-group">
        <label for="primaryColor" class="form-label">Primary Color</label>
        <input type="color" id="primaryColor" name="primaryColor" value="#000000" class="form-input">
    </div>
    <div class="form-group">
        <label for="secondaryColor" class="form-label">Secondary Color</label>
        <input type="color" id="secondaryColor" name="secondaryColor" value="#666666" class="form-input">
    </div>
    <div class="form-group">
        <label for="language" class="form-label">Language</label>
        <select id="language" name="language" class="form-input">
            <option value="en">English</option>
            <option value="pt_br">Português (BR)</option>
        </select>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('sign').value = pluginSettings.sign || 'aries';
            document.getElementById('primaryColor').value = pluginSettings.primaryColor || '#000000';
            document.getElementById('secondaryColor').value = pluginSettings.secondaryColor || '#666666';
            document.getElementById('language').value = pluginSettings.language || 'en';
        }
    });
</script>
