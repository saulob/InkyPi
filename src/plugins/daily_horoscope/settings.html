<div class="form-group">
    <div class="form-group">
        <label for="sign" class="form-label">Zodiac Sign</label>
        <select id="sign" name="sign" class="form-input" required>
            {% for s in zodiac_signs %}
            <option value="{{ s }}">{{ s.capitalize() }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="language" class="form-label">Language</label>
        <select id="language" name="language" class="form-input">
            <option value="en">English</option>
            <option value="pt_br">Português (BR)</option>
        </select>
    </div>

    <!-- color options removed: plugin uses global style settings -->
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('sign').value = pluginSettings.sign || 'aries';
            document.getElementById('language').value = pluginSettings.language || 'en';

            // color settings removed; plugin uses global style settings
        }
    });
</script>
