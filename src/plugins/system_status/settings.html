<style>
    .display-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem 1.2rem;
        margin-top: 0.75rem;
    }

    .display-grid .form-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
    }

    .display-grid input[type="checkbox"] {
        margin: 0;
    }

    .display-grid span {
        white-space: nowrap;
    }
</style>

<div class="form-group">
    <label class="form-label">Display:</label>

    <div class="display-grid">
        <div class="form-group">
            <input type="checkbox" id="showCpu" name="showCpu" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>CPU</span>
        </div>

        <div class="form-group">
            <input type="checkbox" id="showRam" name="showRam" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>RAM</span>
        </div>

        <div class="form-group">
            <input type="checkbox" id="showTemp" name="showTemp" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>Temperature</span>
        </div>

        <div class="form-group">
            <input type="checkbox" id="showUptime" name="showUptime" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>Uptime</span>
        </div>

        <div class="form-group">
            <input type="checkbox" id="showIp" name="showIp" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>Local IP</span>
        </div>

        <div class="form-group">
            <input type="checkbox" id="showDisk" name="showDisk" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>Disk</span>
        </div>

        <div class="form-group">
            <input type="checkbox" id="showDiskUsedTotal" name="showDiskUsedTotal" onclick="this.value=this.checked ? 'true' : 'false';">
            <span>Disk show used/total</span>
        </div>
    </div>
</div>

<div class="form-group">
    <label for="style" class="form-label">Style:</label>
    <select id="style" name="style" class="form-input">
        <option value="dots">Dots</option>
        <option value="bars">Bars</option>
    </select>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('showCpu').checked = pluginSettings.showCpu === 'true';
            document.getElementById('showCpu').value = pluginSettings.showCpu || 'true';

            document.getElementById('showRam').checked = pluginSettings.showRam === 'true';
            document.getElementById('showRam').value = pluginSettings.showRam || 'true';

            document.getElementById('showTemp').checked = pluginSettings.showTemp === 'true';
            document.getElementById('showTemp').value = pluginSettings.showTemp || 'true';

            document.getElementById('showUptime').checked = pluginSettings.showUptime === 'true';
            document.getElementById('showUptime').value = pluginSettings.showUptime || 'true';

            document.getElementById('showIp').checked = pluginSettings.showIp === 'true';
            document.getElementById('showIp').value = pluginSettings.showIp || 'true';

            document.getElementById('showDisk').checked = pluginSettings.showDisk === 'true';
            document.getElementById('showDisk').value = pluginSettings.showDisk || 'true';

            document.getElementById('showDiskUsedTotal').checked = pluginSettings.showDiskUsedTotal === 'true';
            document.getElementById('showDiskUsedTotal').value = pluginSettings.showDiskUsedTotal || 'true';

            document.getElementById('style').value = pluginSettings.style || 'dots';
        } else {
            document.getElementById('showCpu').checked = true;
            document.getElementById('showCpu').value = 'true';

            document.getElementById('showRam').checked = true;
            document.getElementById('showRam').value = 'true';

            document.getElementById('showTemp').checked = true;
            document.getElementById('showTemp').value = 'true';

            document.getElementById('showUptime').checked = true;
            document.getElementById('showUptime').value = 'true';

            document.getElementById('showIp').checked = true;
            document.getElementById('showIp').value = 'true';

            document.getElementById('showDisk').checked = true;
            document.getElementById('showDisk').value = 'true';

            document.getElementById('showDiskUsedTotal').checked = true;
            document.getElementById('showDiskUsedTotal').value = 'true';

            document.getElementById('style').value = 'dots';
        }
    });
</script>
